<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <button class="brand" id="brand" aria-label="만루티켓 캘린더로 이동"><span class="brand-mark"><svg width="25" height="25" viewBox="0 0 32 32" fill="none" aria-hidden="true"><path d="M16 4 28 16 16 28 4 16Z" stroke="currentColor" stroke-width="1.8"/><path d="M16 12 20 16 16 20 12 16Z" fill="currentColor"/><path d="M8 12 12 8M20 24 24 20" stroke="currentColor" stroke-width="1.5"/></svg></span>만루티켓</button>
      <nav class="header-actions" aria-label="주요 메뉴">

        <button class="btn" id="wallet-button"><svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M4 5h16v5a2 2 0 0 0 0 4v5H4v-5a2 2 0 0 0 0-4V5Z" stroke="currentColor" stroke-width="1.6"/><path d="M15 7v2m0 2v2m0 2v2" stroke="currentColor" stroke-width="1.6"/></svg>내 티켓 <span class="ticket-count" id="ticket-count">0</span></button>

  </header>
  <main class="wrap" id="main">
    <nav class="home-tabs" id="home-tabs" aria-label="홈 메뉴">
      <button class="home-tab" data-view="calendar" aria-current="page">경기 캘린더</button>
      <button class="home-tab" data-view="records">경기 기록</button>
      <button class="home-tab" data-view="rankings">현재 순위</button>
      <button class="home-tab" data-view="visits">나의 직관 기록</button>
      <button class="home-tab" data-view="community">커뮤니티</button>
    </nav>
    <section id="calendar-view" aria-labelledby="calendar-title">
      <div class="intro"><div><h1 id="calendar-title">통합 경기 캘린더</h1><p>어느 구단을 응원하든, 예매는 한곳에서.</p></div><span class="practice-label">연습용 앱</span></div>
      <div class="filters" id="filters" role="group" aria-label="구단 필터, 여러 구단 선택 가능"></div>
      <div class="workspace">
        <div class="calendar-area">
          <div class="calendar">
            <div class="calendar-toolbar"><h2 id="month-title"></h2><button class="btn" id="today-button">오늘</button></div>
            <div class="weekdays" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
            <div class="days" id="days" aria-label="이번 달 경기 달력"></div>
          </div>
          <div class="calendar-foot"><span class="legend"><span></span>날짜를 선택하면 모든 경기를 볼 수 있어요</span><span>모든 일정은 가상 데이터입니다</span></div>
          <div class="daily-heading"><h2 id="daily-title"></h2><span class="small-count" id="daily-count"></span></div>
          <div class="match-list" id="match-list"></div>
        </div>
        <aside class="detail" id="detail" aria-label="선택한 경기 상세"></aside>
      </div>
    </section>
    <section id="booking-view" class="flow-shell" hidden aria-label="통합 경기 예매"></section>
    <section id="success-view" hidden aria-label="예매 완료"></section>
    <section id="wallet-view" hidden aria-label="내 티켓"></section>
    <section id="records-view" class="data-surface" hidden aria-label="경기 기록"></section>
    <section id="rankings-view" class="data-surface" hidden aria-label="현재 순위"></section>
    <section id="visits-view" class="data-surface" hidden aria-label="나의 직관 기록"></section>
    <section id="community-view" class="data-surface" hidden aria-label="커뮤니티"></section>
  </main>
  <footer class="footer"><div class="wrap footer-inner"><strong>만루티켓 · 조류동맹</strong><span>가상 경기 · 모의 결제 · 알림 및 전달 기능 준비 중 · 새로고침하면 티켓이 초기화됩니다</span></div></footer>
  <script>
    'use strict';
    const teams = [
      {id:'lg',name:'LG 트윈스',short:'LG',color:'#c30452',stadium:'잠실야구장'},
      {id:'kt',name:'KT 위즈',short:'KT',color:'#252525',stadium:'수원 KT 위즈파크'},
      {id:'ssg',name:'SSG 랜더스',short:'SSG',color:'#ce0e2d',stadium:'인천 SSG 랜더스필드'},
      {id:'nc',name:'NC 다이노스',short:'NC',color:'#315e8b',stadium:'창원 NC 파크'},
      {id:'doosan',name:'두산 베어스',short:'두산',color:'#172951',stadium:'잠실야구장'},
      {id:'kia',name:'KIA 타이거즈',short:'KIA',color:'#d52231',stadium:'광주 기아 챔피언스필드'},
      {id:'lotte',name:'롯데 자이언츠',short:'롯데',color:'#5798bb',stadium:'사직야구장'},
      {id:'samsung',name:'삼성 라이온즈',short:'삼성',color:'#1559b4',stadium:'대구 삼성 라이온즈파크'},
      {id:'hanwha',name:'한화 이글스',short:'한화',color:'#f07722',stadium:'대전 한화생명 볼파크'},
      {id:'kiwoom',name:'키움 히어로즈',short:'키움',color:'#7c173d',stadium:'고척 스카이돔'}
    ];
    const zones=[
      {id:'first101',group:'first',code:101,name:'1루 응원석 101구역',price:22000,angle:315},
      {id:'first102',group:'first',code:102,name:'1루 응원석 102구역',price:18000,angle:345},
      {id:'first103',group:'first',code:103,name:'1루 지정석 103구역',price:16000,angle:15},
      {id:'third301',group:'third',code:301,name:'3루 응원석 301구역',price:22000,angle:195},
      {id:'third302',group:'third',code:302,name:'3루 응원석 302구역',price:18000,angle:165},
      {id:'third303',group:'third',code:303,name:'3루 지정석 303구역',price:16000,angle:135},
      {id:'center201',group:'center',code:201,name:'중앙 테이블석 201구역',price:35000,angle:45},
      {id:'center202',group:'center',code:202,name:'중앙 프리미엄석 202구역',price:30000,angle:75},
      {id:'center203',group:'center',code:203,name:'중앙 지정석 203구역',price:25000,angle:105},
      {id:'outfield401',group:'outfield',code:401,name:'좌측 외야석 401구역',price:12000,angle:225},
      {id:'outfield402',group:'outfield',code:402,name:'중앙 외야석 402구역',price:10000,angle:255},
      {id:'outfield403',group:'outfield',code:403,name:'우측 외야석 403구역',price:12000,angle:285}
    ];
    const now=new Date(), year=now.getFullYear(), month=now.getMonth(), today=now.getDate();
    const monthDays=new Date(year,month+1,0).getDate();
    const weekdays=['일','월','화','수','목','금','토'];
    const games=[],selectedTeams=new Set(),notifications=new Set(),tickets=[];
    let selectedDay=today,selectedGame=null,step=1,selectedZone=null,quantity=0,selectedSeats=[],currentView='calendar',lastOrder=null,orderNumber=0;
    const $=id=>document.getElementById(id);
    const money=value=>value.toLocaleString('ko-KR')+'원';
    const dateLabel=date=>`${date.getMonth()+1}월 ${date.getDate()}일 (${weekdays[date.getDay()]})`;
    const timeLabel=date=>`${String(date.getHours()).padStart(2,'0')}:${String(date.getMinutes()).padStart(2,'0')}`;
    const openLabel=date=>`${date.getMonth()+1}.${String(date.getDate()).padStart(2,'0')} (${weekdays[date.getDay()]}) ${timeLabel(date)}`;
    const dot=team=>`<span class="team-dot" style="background:${team.color}" aria-hidden="true"></span>`;
    const arrow='<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m9 5 7 7-7 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    const backArrow='<svg class="icon" viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="m14 6-6 6 6 6M8 12h12" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    // 월요일은 휴식일. 나머지 날짜는 10개 구단이 한 번씩 출전하는 5경기입니다.
    for(let day=1;day<=monthDays;day++){
      if(new Date(year,month,day).getDay()===1)continue;
      const rotating=teams.slice(1), shift=(Math.floor((day-1)/3))%9;
      const order=[teams[0],...rotating.slice(shift),...rotating.slice(0,shift)];
      for(let i=0;i<5;i++){
        const pair=[order[i],order[9-i]],home=pair[(Math.floor((day-1)/3)+i)%2],away=pair[(Math.floor((day-1)/3)+i+1)%2];
        const date=new Date(year,month,day,[0,6].includes(new Date(year,month,day).getDay())?14+i%2*3:18,i%2?30:0);
        games.push({id:`g-${day}-${i}`,day,home,away,date,stadium:home.stadium,preOpen:new Date(year,month,day-5,11),generalOpen:new Date(year,month,day-3,14)});
      }
    }
    function matchingGames(day){return games.filter(g=>g.day===day&&(!selectedTeams.size||selectedTeams.has(g.home.id)||selectedTeams.has(g.away.id)));}
    function statusLabel(g){const t=Date.now();return t>=g.date.getTime()?'모의 예매':t>=g.generalOpen.getTime()?'일반예매':t>=g.preOpen.getTime()?'선예매':'오픈 예정';}
    function renderFilters(){
      $('filters').innerHTML=teams.map(t=>`<button class="chip" data-team="${t.id}" aria-pressed="${selectedTeams.has(t.id)}">${dot(t)}${t.short}</button>`).join('')+'<button class="filter-reset" id="filter-reset">전체 구단</button>';
    }
    function renderCalendar(){
      $('month-title').textContent=`${year}년 ${month+1}월`;
      let cells='';
      const start=new Date(year,month,1).getDay();
      for(let i=0;i<start;i++)cells+='<div class="day blank" aria-hidden="true"></div>';
      for(let day=1;day<=monthDays;day++){
        const list=matchingGames(day),isToday=day===today,isMonday=new Date(year,month,day).getDay()===1;
        cells+=`<div class="day${day===selectedDay?' selected':''}"><div class="day-top"><button class="day-number${isToday?' today':''}" data-day="${day}" aria-label="${month+1}월 ${day}일, ${list.length}경기" aria-pressed="${day===selectedDay}"${isToday?' aria-current="date"':''}>${day}</button>${isToday?'<span class="day-label">오늘</span>':''}</div>`;
        cells+=list.slice(0,2).map(g=>`<button class="mini-match" data-game="${g.id}" aria-label="${day}일 ${g.home.name} 대 ${g.away.name}, ${timeLabel(g.date)}">${dot(g.home)}${g.home.short} <span class="versus">vs</span> ${g.away.short}</button>`).join('');
        if(list.length>2)cells+=`<button class="more-games" data-day="${day}" aria-label="${day}일 전체 ${list.length}경기 보기">+ ${list.length-2}경기</button>`;
        if(isMonday)cells+='<span class="day-rest">휴식일</span>';
        cells+=`<button class="mobile-games" data-day="${day}" aria-label="${day}일 ${isMonday?'월요일 휴식일':list.length+'경기 보기'}"><span class="dot-strip">${list.map(g=>dot(g.home)).join('')}</span><span>${isMonday?'':list.length?list.length+'경기':'경기 없음'}</span></button></div>`;
      }
      const end=(start+monthDays)%7;
      if(end)for(let i=end;i<7;i++)cells+='<div class="day blank" aria-hidden="true"></div>';
      $('days').innerHTML=cells;
      renderDaily();
    }
    function renderDaily(){
      const list=matchingGames(selectedDay);
      $('daily-title').textContent=dateLabel(new Date(year,month,selectedDay));
      $('daily-count').textContent=`${list.length}경기`;
      $('match-list').innerHTML=list.length?list.map(g=>`<button class="match-row${selectedGame&&selectedGame.id===g.id?' active':''}" data-game="${g.id}" aria-pressed="${!!selectedGame&&selectedGame.id===g.id}"><span class="match-time">${timeLabel(g.date)}</span><span class="match-main"><span class="match-title">${dot(g.home)}${g.home.name}<span class="versus">vs</span>${dot(g.away)}${g.away.name}</span><span class="match-stadium">${g.stadium} · 홈 ${g.home.short}</span></span><span class="match-status">${statusLabel(g)}</span>${arrow}</button>`).join(''):new Date(year,month,selectedDay).getDay()===1?'<p class="empty-list">월요일은 휴식일이에요. 다른 날짜의 경기를 확인해 주세요.</p>':'<p class="empty-list">선택한 구단의 경기가 없어요. 전체 구단을 선택해 보세요.</p>';
    }
    function renderDetail(){
      const g=selectedGame;

    function fakeQr(id){
      const n=25;let seed=Array.from(id).reduce((v,c)=>v*31+c.charCodeAt(0),7)>>>0,rects='';
      const finders=[[0,0],[18,0],[0,18]];
      for(let y=0;y<n;y++)for(let x=0;x<n;x++){
        const f=finders.find(([fx,fy])=>x>=fx-1&&x<=fx+7&&y>=fy-1&&y<=fy+7);
        let dark=false;
        if(f){const dx=x-f[0],dy=y-f[1];if(dx>=0&&dx<7&&dy>=0&&dy<7)dark=dx===0||dx===6||dy===0||dy===6||(dx>=2&&dx<=4&&dy>=2&&dy<=4);}

      {category:'직관 후기',author:'사직의봄',time:'10분 전',title:'사직 101구역에서 응원하고 왔어요',body:'그라운드도 잘 보이고 응원 열기도 뜨거웠어요. 친구랑 다음 경기 티켓도 같이 골라보려고요.',comments:12,likes:34},
      {category:'응원 이야기',author:'대전오렌지',time:'35분 전',title:'가상 순위 2위 한화! 다음 직관은 어디로?',body:'이번 연습 시즌 순위가 마음에 드네요. 대전에서 같이 응원할 날을 기다립니다.',comments:8,likes:27},
      {category:'좌석 팁',author:'야구장산책',time:'1시간 전',title:'테이블석과 중앙 지정석, 어떤 자리가 좋을까요?',body:'편하게 먹으면서 보려면 테이블석, 경기 흐름을 가까이 보고 싶으면 중앙 지정석을 추천해요. 여러분의 최애 구역은요?',comments:16,likes:19},
      {category:'직관 준비',author:'초록다이아몬드',time:'2시간 전',title:'첫 직관 준비물, 이것만 챙겨도 든든해요',body:'모자와 물, 휴대용 보조배터리부터 챙겼어요. 야간 경기에는 가벼운 겉옷도 있으면 좋더라고요.',comments:5,likes:42},
      {category:'응원 이야기',author:'만루의순간',time:'3시간 전',title:'10개 구단 응원가 중 가장 기억에 남는 곡은?',body:'팀은 달라도 야구를 좋아하는 마음은 같죠. 경기 시작 전에 들으면 설레는 응원가 이야기를 나눠봐요.',comments:23,likes:31}
    ];
    const teamById=id=>teams.find(t=>t.id===id);
    function dataHeading(title,description){return `<div class="data-heading"><div><h1>${title}</h1><p>${description}</p></div><span class="practice-label">가짜 데이터</span></div>`;}
    function renderRecords(){
      $('records-view').innerHTML=dataHeading('경기 기록','끝난 경기의 스코어와 이야기를 한눈에.')+`<div class="records-list">${mockRecords.map(r=>{
        const home=teamById(r.home),away=teamById(r.away),result=r.homeScore===r.awayScore?'무승부':`${r.homeScore>r.awayScore?home.short:away.short} 승리`;
        return `<article class="record-row"><span class="record-date">${dateLabel(r.date)}</span><div><h2 class="record-score"><span>${dot(home)} ${home.short}</span><strong>${r.homeScore} : ${r.awayScore}</strong><span>${dot(away)} ${away.short}</span></h2><p>${home.stadium} · 경기 종료</p><p>${r.note}</p></div><span class="record-result">${result}</span></article>`;
      }).join('')}</div><p class="data-disclaimer">샘플 경기 5개입니다. 실제 경기 결과와 다르며, 실시간으로 갱신되지 않습니다.</p>`;
    }
    function renderRankings(){
      $('rankings-view').innerHTML=dataHeading('현재 순위','우리 팀은 어디쯤? 10개 구단의 가상 시즌 순위.')+`<div class="table-wrap"><table class="rank-table"><caption>연습용 가상 순위 · 1위 롯데, 2위 한화</caption><thead><tr><th scope="col">순위</th><th scope="col">구단</th><th scope="col">승</th><th scope="col">패</th><th scope="col">무</th><th scope="col">승률</th><th scope="col">게임차</th></tr></thead><tbody>${mockRankings.map((r,i)=>`<tr${i<2?' class="leading"':''}><td class="rank-number">${i+1}</td><td><span class="rank-team">${dot(r.team)}${r.team.name}</span></td><td>${r.wins}</td><td>${r.losses}</td><td>${r.draws}</td><td>${(r.wins/(r.wins+r.losses)).toFixed(3)}</td><td>${i?((mockRankings[0].wins-r.wins+r.losses-mockRankings[0].losses)/2).toFixed(1):'—'}</td></tr>`).join('')}</tbody></table></div><p class="data-disclaimer">실제 KBO 순위가 아닌 가짜 데이터입니다. 승률은 무승부를 제외해 계산했습니다.</p>`;
    }
    function renderVisits(){
      $('visits-view').innerHTML=dataHeading('나의 직관 기록','야구장에서 보낸 하루하루를 모아봐요.')+`<div class="visit-summary"><span>직관 경기<strong>5회</strong></span><span>승리<strong>3회</strong></span><span>다녀온 구장<strong>2곳</strong></span></div><div class="visit-list">${mockVisits.map(v=>{
        const home=teamById(v.home),away=teamById(v.away);return `<article class="visit-row"><span class="visit-month">${v.date.getMonth()+1}.${String(v.date.getDate()).padStart(2,'0')}</span><div><h2>${dot(home)} ${home.short} vs ${away.short} · ${v.score}</h2><p>${home.stadium} · ${v.seat}</p><p class="visit-note">${v.note}</p></div><span class="visit-badge">${v.result}</span></article>`;
      }).join('')}</div><p class="data-disclaimer">직관 기록 5개는 샘플입니다. 이번 앱에서 예매한 티켓은 ‘내 티켓’에서 확인할 수 있어요.</p>`;
    }
    function renderCommunity(){
      $('community-view').innerHTML=dataHeading('커뮤니티','응원하는 팀은 달라도, 야구 이야기는 함께.')+`<div class="community-list">${mockPosts.map(p=>`<article class="post"><div class="post-meta"><span class="post-category">${p.category}</span><span>${p.author}</span><span>${p.time}</span></div><h2>${p.title}</h2><p>${p.body}</p><div class="post-footer"><span>댓글 ${p.comments}</span><span>공감 ${p.likes}</span></div></article>`).join('')}</div><p class="data-disclaimer">게시글 5개는 가짜 데이터입니다. 글쓰기·댓글·공감 기능은 준비 중입니다.</p>`;
    }
    function openHomeTab(view){
      if(view==='calendar'){openCalendar();return;}
      const renderers={records:renderRecords,rankings:renderRankings,visits:renderVisits,community:renderCommunity};
      if(renderers[view]){renderers[view]();showView(view);}
    }
    function toggleSeat(id,target){
      if(currentView!=='booking'||step!==2)return;
      const seat=seatsForZone().find(s=>s.id===id);if(!seat||isSeatTaken(seat))return;
      const index=selectedSeats.findIndex(s=>s.id===id);
      if(index>=0)selectedSeats.splice(index,1);
      else if(selectedSeats.length<4){selectedSeats.push(seat);selectedSeats.sort((a,b)=>a.id.localeCompare(b.id));}
      else{$('seat-feedback').textContent='한 번에 최대 4개 좌석까지 선택할 수 있어요. 선택한 좌석을 해제해 주세요.';return;}
      quantity=selectedSeats.length;
      target.setAttribute('aria-pressed',String(selectedSeats.some(s=>s.id===id)));
      $('seat-selection-info').textContent=quantity?`선택 ${quantity}장 · ${selectedSeats.map(s=>s.label).join(', ')}`:'원하는 좌석을 눌러 주세요. 다시 누르면 선택이 해제됩니다.';
      $('seat-feedback').textContent='';
      document.querySelector('.order-summary').outerHTML=renderSummary();
    }
    document.addEventListener('click',event=>{
      const button=event.target.closest('button');
      if(button&&button.disabled)return;
      const target=event.target.closest('[data-team],[data-day],[data-game],[data-zone],[data-seat],[data-view],button');
      if(!target)return;
      if(target.dataset.view){openHomeTab(target.dataset.view);return;}
      if(target.dataset.seat){toggleSeat(target.dataset.seat,target);return;}
      if(target.dataset.team){
        const id=target.dataset.team;selectedTeams.has(id)?selectedTeams.delete(id):selectedTeams.add(id);
        const visible=matchingGames(selectedDay);if(!selectedGame||!visible.some(g=>g.id===selectedGame.id))selectedGame=visible[0]||null;
        renderFilters();renderCalendar();renderDetail();$('filters').querySelector(`[data-team="${id}"]`).focus({preventScroll:true});return;
      }
      if(target.dataset.day){selectDay(Number(target.dataset.day));$('days').querySelector(`.day-number[data-day="${selectedDay}"]`).focus({preventScroll:true});return;}
      if(target.dataset.game){selectGame(target.dataset.game,target.classList.contains('mini-match')?'calendar':'row');return;}
      if(target.dataset.zone&&currentView==='booking'&&step===1){if(!selectedZone||selectedZone.id!==target.dataset.zone){selectedSeats=[];quantity=0;}selectedZone=zones.find(z=>z.id===target.dataset.zone);renderBooking();$('booking-view').querySelector(`button[data-zone="${selectedZone.id}"]`).focus({preventScroll:true});return;}
      switch(target.id){
        case 'brand':case 'success-calendar':case 'wallet-calendar':case 'empty-calendar':openCalendar();break;
        case 'wallet-button':case 'success-wallet':openWallet();break;
        case 'filter-reset':selectedTeams.clear();renderFilters();selectDay(selectedDay);$('filter-reset').focus({preventScroll:true});break;
        case 'today-button':selectDay(today);break;
        case 'notify-switch':{
          const id=selectedGame.id;notifications.has(id)?notifications.delete(id):notifications.add(id);
          const enabled=notifications.has(id);target.setAttribute('aria-checked',String(enabled));
          $('notification-status').textContent=enabled?'알림 설정됨 · 실제 발송은 준비 중':'예매 오픈 일정을 놓치지 마세요';$('notification-status').classList.toggle('enabled',enabled);break;
        }
        case 'book-button':startBooking();break;
        case 'booking-back':if(step===1)openCalendar();else{step--;renderBooking();const heading=$('booking-view').querySelector('.section-heading');heading.tabIndex=-1;heading.focus({preventScroll:true});}break;
        case 'next-button':if(step<3&&selectedZone&&(step===1||selectedSeats.length)){step++;renderBooking();const heading=$('booking-view').querySelector('.section-heading');heading.tabIndex=-1;heading.focus({preventScroll:true});}else if(step===3)completeBooking();break;
      }
    });
    renderFilters();selectDay(today);
    setInterval(updateCountdown,1000);
  </script>
</body>
</html>
